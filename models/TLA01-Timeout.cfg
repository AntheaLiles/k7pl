CONSTANTS
    Actors = {ActorA, ActorB}
    External = ExternalSource
    NoActor = NoActorValue
    StaticDependencies = {}
    ReceiveFrom = [ActorA |-> ExternalSource, ActorB |-> NoActorValue]
    SendTo = [ActorA |-> NoActorValue, ActorB |-> NoActorValue]
    InitialResidual = [ActorA |-> "Recv", ActorB |-> "End"]
    TimeoutsEnabled = TRUE
    ExternalDeliveryEnabled = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SessionEndpointDuality
INVARIANT StaticAcyclic
INVARIANT Simulation
INVARIANT MessageConservation
INVARIANT MailboxOwnership
INVARIANT StateConsistency
INVARIANT NoMutualWaitDeadlock

CHECK_DEADLOCK FALSE
