CONSTANTS
    Branches = {Left, Right}
    Events = {L1, L2, R1, R2}
    BranchOf = [L1 |-> Left, L2 |-> Left, R1 |-> Right, R2 |-> Right]
    EventIndex = [L1 |-> 1, L2 |-> 2, R1 |-> 1, R2 |-> 2]
    Predecessors = [L1 |-> {}, L2 |-> {L1}, R1 |-> {}, R2 |-> {R1}]
    UnsafeEarlyJoin = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT CausalPredecessorsEmitted
INVARIANT JoinRequiresAllBranches
INVARIANT PublishedResultsComplete
CHECK_DEADLOCK FALSE
