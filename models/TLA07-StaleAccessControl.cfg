CONSTANTS
    Slots = {SlotA}
    Generations = {0, 1}
    MaxGeneration = 1
    Capabilities = {CapA, CapB}
    CapSlot = [CapA |-> SlotA, CapB |-> SlotA]
    CapCells = [CapA |-> {CellA}, CapB |-> {CellB}]
    OwnerOf = [CapA |-> FibreA, CapB |-> FibreB]
    Cells = {CellA, CellB}
    AllowGenerationWrap = FALSE
    UnsafeStaleAccess = TRUE
    UnsafeRestoreRevive = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoUnauthorizedAccess
CHECK_DEADLOCK FALSE
