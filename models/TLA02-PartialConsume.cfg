CONSTANTS
    Messages = {L1, L2, R1, R2}
    LeftMessages = {L1, L2}
    RightMessages = {R1, R2}
    KeyOf = [L1 |-> 1, L2 |-> 2, R1 |-> 1, R2 |-> 2]
    Rank = [L1 |-> 1, L2 |-> 2, R1 |-> 3, R2 |-> 4]
