CONSTANTS
    Actors = {ActorA, ActorB, ActorC}
    External = ExternalSource
    NoActor = NoActorValue
    StaticDependencies = {
        <<ActorA, ActorB>>,
        <<ActorB, ActorC>>
    }
    ReceiveFrom = [ActorA |-> ActorB, ActorB |-> ActorC, ActorC |-> ActorA]
    SendTo = [ActorA |-> ActorC, ActorB |-> ActorA, ActorC |-> ActorB]
    InitialResidual = [ActorA |-> "Recv", ActorB |-> "Recv", ActorC |-> "Recv"]
    TimeoutsEnabled = FALSE
    ExternalDeliveryEnabled = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SessionEndpointDuality
INVARIANT StaticAcyclic
INVARIANT Simulation

CHECK_DEADLOCK FALSE
