# Conventional Commits : <type>(<scope>): <description>
# Voir .claude/skills/writing-rules.md, section « Conventional Commits ».
extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - [feat, fix, docs, style, refactor, perf, test, build, ci, chore]
