# Default gitleaks rules, plus an allowlist for the archived Org tooling and its data: file-path
# strings ("src", "chapitres", "c2-fondements.org") and bibliography keys trip the
# generic-api-key rule. (`[allowlist]`: the syntax gitleaks 8.24 reads.)
[extend]
useDefault = true

[allowlist]
description = "Archived Org tooling (paths and bibliography keys, no secrets) and one fake test fixture"
paths = ['''^docs/archives/outillage-org/''']
# The fake token of scripts/ci/test_sync_zenodo.py (a test double that is never sent anywhere).
# gitleaks scans the whole history of a pull request, so renaming the constant cannot make the
# commit that introduced it disappear. The allowlist matches this exact value only: any other
# secret-looking string, in that file or elsewhere, is still reported.
regexes = ['''^tok-secret-0123456789$''']
