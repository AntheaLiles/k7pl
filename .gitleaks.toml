# Default gitleaks rules, plus an allowlist for the archived Org tooling and its data: file-path
# strings ("src", "chapitres", "c2-fondements.org") and bibliography keys trip the
# generic-api-key rule. (`[allowlist]`: the syntax gitleaks 8.24 reads.)
[extend]
useDefault = true

[allowlist]
description = "Archived Org tooling (paths and bibliography keys, no secrets)"
paths = ['''^archives/outillage-org/''']
