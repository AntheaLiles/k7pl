[pytest]
# tests/python hosts the pytest suite for the tooling under scripts/.
testpaths = tests/python
# libtmux ships a pytest plugin that crashes on import (marks applied to
# fixtures); it is unrelated to this project, so it must never load.
addopts = -p no:cacheprovider -p no:libtmux
