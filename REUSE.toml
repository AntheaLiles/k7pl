version = 1

# Fichiers non commentables ou métadonnées techniques : CC0.
[[annotations]]
path = [
  "lean-toolchain",
  "proofs/lean-toolchain",
  "proofs/lake-manifest.json",
  "proofs/axiom-audit-contract.json",
  "spec/formal-chain/lean-toolchain",
  "spec/formal-chain/lake-manifest.json",
  "lake-manifest.json",
  "tools/paperproof-export/lean-toolchain",
  "tools/paperproof-export/lake-manifest.json",
  "zenodo.json",
  "zenodo.files.json",
  ".claude/settings.json",
  ".github/annotation-policy.json",
  ".github/lean-problem-matcher.json",
  ".github/lean-spec-warning-problem-matcher.json",
  ".github/reuse-problem-matcher.json",
  "scripts/ci/badge_criteria_registry.json"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"

# Configuration racine : CC0.
[[annotations]]
path = [
  ".gitignore",
  "Makefile",
  "src/k/.gitignore",
  "src/k/Makefile",
  "proofs/Makefile",
  "spec/formal-chain/Makefile",
  "proofs/.gitignore",
  "proofs/lakefile.toml",
  "spec/formal-chain/.gitignore",
  "spec/formal-chain/lakefile.lean",
  ".gitattributes",
  ".editorconfig",
  ".commitlintrc.yaml",
  ".gitleaks.toml",
  ".howfairis.yml",
  "pytest.ini",
  "CITATION.cff"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"

# Figures de la spécification : même licence que la spécification.
[[annotations]]
path = "spec/figures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Documentation et archives documentaires : CC-BY-4.0.
[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Projets théoriques non normatifs (k7os, …) : même licence que la
# documentation. Les fichiers déplacés hors de docs/ en 2026-10-25 avaient
# perdu la couverture docs/** ; cette règle la leur rend, sans toucher à
# leurs en-têtes propres quand ils en ont un (precedence aggregate).
[[annotations]]
path = "theoretical-projects/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Ancien outillage Org : le code reste du logiciel.
[[annotations]]
path = "docs/archives/outillage-org/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# Données bibliographiques : métadonnées réutilisables ; les décisions
# bibliographiques restent documentaires.
[[annotations]]
path = "wiki/references.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "wiki/bibliography-decisions.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Artefact bibliographique généré : la source est le script, cet artefact
# est librement réutilisable.
[[annotations]]
path = "tools/SpecBib.lean"
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"

# Données de sondes : licence provisoire explicite, sous réserve de l'audit
# des extraits provenant de sources tierces.
[[annotations]]
path = "scripts/controles/donnees/sondes.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"

# Bibliothèque d'exemple écrite en K7PL.
[[annotations]]
path = "lib/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-C"

# Plain K program inputs are parsed as source expressions, so licensing metadata
# is declared here instead of prefixing the expression with a source comment.
[[annotations]]
path = "tests/examples/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-C"

# Documentation of lib/: CC-BY-4.0, like the rest of the documentation,
# instead of being aggregated with the CECILL-C annotation above.
[[annotations]]
path = "lib/README.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"
# Slice 1 CI controller (2026-10-25): JSON files cannot carry an
# SPDX header. The TypeScript sources carry CECILL-2.1 headers;
# the configuration files below are technical metadata (CC0),
# like the other CI configuration in this file.
[[annotations]]
path = [
  "tools/ci-controller/deno.json",
  "tools/ci-controller/deno.lock",
  "tools/ci-controller/evidence.schema.json",
  ".github/ci/components.yaml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC0-1.0"
