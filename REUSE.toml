version = 1

[[annotations]]
path = ".gitignore"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

[[annotations]]
path = ".gitattributes"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

[[annotations]]
path = ".editorconfig"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# lean-toolchain est lu tel quel par elan : aucun commentaire possible.
[[annotations]]
path = "lean-toolchain"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# Fichier généré par Lake (JSON, pas de commentaires).
[[annotations]]
path = "lake-manifest.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# JSON: no comments allowed.
[[annotations]]
path = ".claude/settings.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# Zenodo metadata (JSON: no comments allowed).
[[annotations]]
path = ["zenodo.json", "zenodo.files.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# Figures de la spécification (SVG et PDF dérivés, sources drawio et mermaid) : CC-BY-4.0 comme
# le texte qu'elles illustrent.
[[annotations]]
path = "spec/figures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Documentation de travail (suivi, relectures, méthode, recherche, journal) : Markdown converti
# du dossier de travail, sans en-tête.
[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Manuscrit Org-mode figé : le texte de la spécification, donc la même licence qu'elle.
[[annotations]]
path = "docs/archives/manuscrit-org/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CC-BY-4.0"

# Ancien outillage (code Python, Emacs Lisp, LaTeX, Makefile, données) et ses notices.
[[annotations]]
path = ["docs/archives/outillage-org/**", "docs/archives/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

[[annotations]]
path = "scripts/controles/donnees/sondes.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"

# GitHub Actions problem matcher (JSON: no comments allowed in the matcher itself).
[[annotations]]
path = ".github/lean-problem-matcher.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"


# GitHub Actions problem matcher (JSON: no comments allowed in the matcher itself).
[[annotations]]
path = ".github/reuse-problem-matcher.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Cyprien PIERRE"
SPDX-License-Identifier = "CECILL-2.1"
