name: Full Verification

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-verification
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
    with:
      full: true
