name: Lean Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Releases: `spec-vX.Y.Z` publishes the specification PDF on Zenodo,
  # `vX.Y.Z` releases the implementation.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs elan, fetches the Mathlib cache, then runs `lake build`, `lake test`,
      # `lake lint` and the axiom audit (only propext, Classical.choice and Quot.sound
      # are allowed under the `K7pl` namespace; `sorry` is rejected).
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
          test: true
          lint: true
          axiom-audit: true
          axiom-audit-root: K7pl

      # Checks on the Verso sources (laws of the algebra at 0 and ω, seals, propagation of open
      # statements, grammar × rules, structure); they replace the checks of the former Org tooling.
      - name: Check the specification
        run: python3 scripts/controle.py

      - name: Render the specification (HTML and TeX)
        run: lake exe spec --output _out/spec --with-tex

      - name: Upload the specification (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-html
          path: _out/spec/html-multi
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (TeX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tex
          path: _out/spec/tex
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (GitHub Pages)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/spec/html-multi

  deploy-spec:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  spec-pdf:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TECTONIC_VERSION: 0.15.0
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tex
          path: _out/spec/tex

      # Tectonic (XeTeX engine) downloads only the TeX files it needs, on demand, from its bundle:
      # no TeX Live installation. The downloaded files are cached.
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Cache Tectonic files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          # The cache only holds the TeX packages Tectonic downloads: it depends on the Tectonic
          # version, not on the sources of the specification.
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-v1
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      - name: Compile the PDF
        working-directory: _out/spec/tex
        run: |
          tectonic -X compile --keep-logs main.tex
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp main.pdf "$GITHUB_WORKSPACE/out/k7pl-spec.pdf"

      - name: Upload the specification (PDF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-pdf
          path: out/k7pl-spec.pdf
          retention-days: 90
          if-no-files-found: error

  # Implementation release (`vX.Y.Z`): the version must match lakefile.lean and CHANGELOG.md.
  release-check:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the release matches lakefile.lean and CHANGELOG.md
        run: |
          version="${TAG#v}"
          lake_version="$(sed -n 's/^ *version := v!"\(.*\)"$/\1/p' lakefile.lean)"
          if [ "$lake_version" != "$version" ]; then
            echo "::error::lakefile.lean declares version '$lake_version' but the release is '$TAG'"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  # Specification release (`spec-vX.Y.Z`): archives the PDF artifact on Zenodo (one DOI per
  # version) and attaches it to the release.
  zenodo:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'spec-v')
    needs: spec-pdf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push .zenodo_state.json to the zenodo-state branch, upload the release asset
    concurrency:
      group: zenodo
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the release matches CITATION.cff and spec/CHANGELOG.md
        run: |
          version="${TAG#spec-v}"
          cff="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' CITATION.cff)"
          if [ "$cff" != "$version" ]; then
            echo "::error::CITATION.cff declares version '$cff' but the release is '$TAG'"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" spec/CHANGELOG.md; then
            echo "::error::spec/CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-pdf
          path: out

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the dependencies
        run: pip install --require-hashes -r scripts/requirements-zenodo.txt

      - name: Restore the Zenodo state
        run: |
          if git fetch --depth 1 origin zenodo-state; then
            git show FETCH_HEAD:.zenodo_state.json > .zenodo_state.json
          else
            echo "{}" > .zenodo_state.json
          fi

      - name: Publish on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_ENV: ${{ secrets.ZENODO_ENV }}
        run: ZENODO_VERSION="${TAG#spec-v}" python scripts/sync_zenodo.py

      - name: Save the Zenodo state
        run: |
          dir="$RUNNER_TEMP/zenodo-state"
          if git fetch --depth 1 origin zenodo-state; then
            git worktree add --detach "$dir" FETCH_HEAD
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan zenodo-state
            git -C "$dir" rm -rfq .
          fi
          cp .zenodo_state.json "$dir/.zenodo_state.json"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .zenodo_state.json
          git commit -m "chore(zenodo): enregistrer l'état de la publication $TAG"
          git push origin HEAD:refs/heads/zenodo-state

      - name: Attach the PDF to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/k7pl-spec.pdf --clobber
