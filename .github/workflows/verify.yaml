name: Verification

on:
  workflow_call:
    inputs:
      full:
        description: "Exécuter toutes les validations"
        required: false
        type: boolean
        default: false
      docs_links:
        description: "Contrôler les liens Markdown"
        required: false
        type: boolean
        default: false
      spec_check:
        description: "Exécuter les contrôles statiques de la spécification"
        required: false
        type: boolean
        default: false
      spec_build:
        description: "Compiler et rendre la spécification"
        required: false
        type: boolean
        default: false
      lean_build:
        description: "Compiler, tester et auditer l'implémentation Lean"
        required: false
        type: boolean
        default: false
      python_tests:
        description: "Exécuter les tests de l'outillage Python"
        required: false
        type: boolean
        default: false
      deploy_pages:
        description: "Publier la spécification sur GitHub Pages après validation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    name: Contrôles rapides
    if: ${{ inputs.full || inputs.docs_links || inputs.spec_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the specification
        if: ${{ inputs.full || inputs.spec_check }}
        run: python3 scripts/controle.py --format github

      - name: Check the local links
        if: ${{ inputs.full || inputs.docs_links }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  impl:
    name: Implémentation Lean
    if: ${{ inputs.full || inputs.lean_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Restore the Lake dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-gitdeps-v1

      - name: Fetch the Mathlib cache
        run: |
          if ! lake exe cache get; then
            # A silent fallback to a full rebuild on main would hide a lasting cache outage and
            # quietly double CI times; on a PR, tolerance is worth more than an alert.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Mathlib cache unavailable on main — refusing to mask a lasting outage"
              exit 1
            fi
            echo "::warning::Mathlib cache unavailable, full rebuild ahead"
          fi

      - name: Build the implementation and the tests
        run: lake build K7pl K7plTests

      - name: Test
        run: lake test

      - name: Lint
        if: ${{ !cancelled() }}
        run: lake lint

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Implementation"
            echo "- Modules: $(find src tests -name '*.lean' | wc -l)"
            echo "- Lean: $(cat lean-toolchain)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit the axioms
        if: ${{ !cancelled() }}
        run: scripts/axiom-audit.sh K7pl K7pl

  python-tests:
    name: Tests de l'outillage Python
    if: ${{ inputs.full || inputs.python_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install "pytest>=8"

      - name: Test the CI impact classifier
        run: python3 scripts/ci/test_impact.py

      - name: Test the Python tooling (mini-corpus Verso, auto-tests mutés)
        run: python3 -m pytest tests/python -q

      - name: Check the real corpus with the tooling under test
        # The whole point of the mini-corpus is to run these controls where spec/ is absent; this
        # step mirrors `python3 scripts/controle.py --format github` locally and catches drift
        # between the synthetic corpus and the real manuscript. sync_zenodo.py is not covered:
        # its only third-party dependency (requests) lives in the pinned requirements-zenodo.txt
        # (with hashes), which the full lane installs — see .github/workflows/full.yaml.
        run: python3 scripts/controle.py

  spec:
    name: Spécification Verso
    if: ${{ inputs.full || inputs.spec_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Restore the Lake dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-gitdeps-v1
          restore-keys: |
            lake-deps-

      - name: Build the specification
        run: lake build Spec

      - name: Audit the axioms
        run: scripts/axiom-audit.sh Spec Spec

      - name: Render the specification (HTML and TeX)
        run: lake exe spec --output _out/spec --with-tex

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Specification"
            echo "- HTML pages: $(find _out/spec/html-multi -name '*.html' 2>/dev/null | wc -l)"
            echo "- Verso modules: $(find spec -name '*.lean' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the specification (HTML)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-html
          path: _out/spec/html-multi
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (TeX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tex
          path: _out/spec/tex
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (GitHub Pages)
        if: ${{ inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/spec/html-multi

  spec-pdf:
    name: PDF de la spécification
    if: ${{ inputs.full || inputs.spec_build }}
    needs: spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TECTONIC_VERSION: 0.15.0
      TECTONIC_SHA256: dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tex
          path: _out/spec/tex

      - name: Install Tectonic
        shell: bash
        run: |
          set -euo pipefail
          archive="tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@${TECTONIC_VERSION}/$archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/tectonic" "$RUNNER_TEMP/tectonic-bin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Cache Tectonic files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-v1
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      - name: Compile the PDF
        working-directory: _out/spec/tex
        run: |
          tectonic -X compile --keep-logs main.tex
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp main.pdf "$GITHUB_WORKSPACE/out/k7pl-spec.pdf"

      - name: Upload the specification (PDF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-pdf
          path: out/k7pl-spec.pdf
          retention-days: 90
          if-no-files-found: error

  verification-result:
    name: Résultat de la vérification
    if: always()
    needs: [quick, impl, python-tests, spec, spec-pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept successful or intentionally skipped jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::un contrôle requis a échoué ou a été interrompu ($result)"
                exit 1
                ;;
            esac
          done

