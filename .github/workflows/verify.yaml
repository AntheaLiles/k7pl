name: Verification

on:
  workflow_call:
    inputs:
      full:
        description: "Exécuter toutes les validations"
        required: false
        type: boolean
        default: false
      docs_links:
        description: "Contrôler les liens Markdown"
        required: false
        type: boolean
        default: false
      spec_check:
        description: "Exécuter les contrôles statiques de la spécification"
        required: false
        type: boolean
        default: false
      spec_build:
        description: "Compiler et rendre la spécification"
        required: false
        type: boolean
        default: false
      lean_build:
        description: "Compiler, tester et auditer l'implémentation Lean"
        required: false
        type: boolean
        default: false
      python_tests:
        description: "Exécuter les tests de l'outillage Python"
        required: false
        type: boolean
        default: false
      tracking_views:
        description: "Vérifier les vues de suivi générées"
        required: false
        type: boolean
        default: false
      deploy_pages:
        description: "Publier la spécification sur GitHub Pages après validation"
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Restaurer les caches Lake et Tectonic (false : construction à froid, par exemple pour une release)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quick:
    name: Contrôles rapides
    if: ${{ inputs.full || inputs.docs_links || inputs.spec_check || inputs.tracking_views }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation architecture
        run: python3 scripts/ci/check_documentation_architecture.py

      - name: Check the specification
        if: ${{ inputs.full || inputs.spec_check }}
        run: python3 scripts/controle.py --format github

      - name: Check generated tracking views
        if: ${{ inputs.tracking_views }}
        run: |
          set -euo pipefail
          python3 scripts/suivi.py check
          python3 scripts/suivi.py all
          git diff --exit-code -- docs/tracking/

      - name: Check the local links
        if: ${{ inputs.full || inputs.docs_links }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path docs/archives '**/*.md'
          fail: true

  impl:
    name: Implémentation Lean
    if: ${{ inputs.full || inputs.lean_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Restore the Lake dependencies
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Fetch the Mathlib cache
        run: lake exe cache get || echo "Mathlib cache unavailable, full rebuild ahead"

      # A Lean file that no lean_lib/lean_exe root reaches is never compiled by `lake build`. The scan
      # covers src/ and tests/ only, and any declared lean_lib counts as a root, even one that this
      # job does not build (no default target).
      # The check sits right before the build, after the Mathlib cache: the steps that run even
      # after a failure (lint, audits) must not start from a cold Mathlib.
      - name: Check that every Lean file is built
        run: python3 scripts/ci/check_lean_modules.py

      - name: Register the Lean problem matcher
        run: echo "::add-matcher::.github/lean-problem-matcher.json"

      - name: Build the implementation and the tests
        run: lake build K7pl K7plTests K7plCompliance sbomAudit

      - name: Audit the scoped Lake-to-SPDX inventory
        run: |
          set -euo pipefail
          python3 scripts/ci/lake_manifest_to_spdx.py \
            --created 2026-10-10T00:00:00Z \
            --output "$RUNNER_TEMP/k7pl-lake.spdx.json"
          lake exe sbomAudit lake-manifest.json "$RUNNER_TEMP/k7pl-lake.spdx.json" \
            > "$RUNNER_TEMP/k7pl-sbom-audit.json"
          python3 - "$RUNNER_TEMP/k7pl-sbom-audit.json" lake-manifest.json \
            "$RUNNER_TEMP/k7pl-lake.spdx.json" "$RUNNER_TEMP/k7pl-sbom-evidence.json" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          report_path, manifest_path, sbom_path, evidence_path = sys.argv[1:]
          with open(report_path, encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["schemaVersion"] == "k7pl.compliance-report/v1", report
          assert report["tool"] == "k7pl-sbom-audit", report
          assert report["status"] == "PASS", report
          assert report["diagnostics"] == [], report
          assert report["sourceArtifacts"][0] == "lake-manifest.json", report
          assert report["sourceArtifacts"][1].endswith("/k7pl-lake.spdx.json"), report

          # End-to-end negative cases exercise the executable's exit-code/report contract.
          malformed_manifest = Path(os.environ["RUNNER_TEMP"]) / "malformed-manifest.json"
          malformed_manifest.write_text("{", encoding="utf-8")
          malformed = subprocess.run(
              ["lake", "exe", "sbomAudit", str(malformed_manifest), sbom_path],
              check=False, capture_output=True, text=True,
          )
          assert malformed.returncode == 2, (malformed.returncode, malformed.stdout, malformed.stderr)
          malformed_report = json.loads(malformed.stdout)
          assert malformed_report["status"] == "ERROR", malformed_report
          assert any(d["ruleId"] == "INPUT-JSON-MANIFEST" for d in malformed_report["diagnostics"]), malformed_report

          with open(sbom_path, encoding="utf-8") as stream:
              mutated_sbom = json.load(stream)
          original_revision = mutated_sbom["packages"][0]["versionInfo"]
          replacement_char = "e" if original_revision[0] == "f" else "f"
          mutated_sbom["packages"][0]["versionInfo"] = replacement_char + original_revision[1:]
          mismatch_path = Path(os.environ["RUNNER_TEMP"]) / "mismatched.spdx.json"
          mismatch_path.write_text(json.dumps(mutated_sbom), encoding="utf-8")
          mismatch = subprocess.run(
              ["lake", "exe", "sbomAudit", manifest_path, str(mismatch_path)],
              check=False, capture_output=True, text=True,
          )
          assert mismatch.returncode == 1, (mismatch.returncode, mismatch.stdout, mismatch.stderr)
          mismatch_report = json.loads(mismatch.stdout)
          assert mismatch_report["status"] == "FAIL", mismatch_report
          assert any(d["ruleId"] == "SBOM-INVENTORY-MISMATCH" for d in mismatch_report["diagnostics"]), mismatch_report

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          event = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path:
              with open(event_path, encoding="utf-8") as stream:
                  event = json.load(stream)
          pull_request_head = (event.get("pull_request") or {}).get("head", {}).get("sha")
          evidence = {
              "schemaVersion": "k7pl.ci-evidence/v1",
              "workflow": {
                  "name": "CI",
                  "runId": int(os.environ["GITHUB_RUN_ID"]),
                  "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "checkedOutSha": os.environ["GITHUB_SHA"],
                  "pullRequestHeadSha": pull_request_head,
              },
              "toolchain": {
                  "lean": Path("lean-toolchain").read_text(encoding="utf-8").strip(),
                  "sbomGenerator": "k7pl-lake-sbom@0.1.0",
                  "leanAudit": "k7pl-sbom-audit@0.1.0",
              },
              "inputs": [
                  {"artifact": "lake-manifest.json", "sha256": sha256(manifest_path)},
                  {"artifact": "lakefile.lean", "sha256": sha256("lakefile.lean")},
                  {"artifact": "lean-toolchain", "sha256": sha256("lean-toolchain")},
                  {"artifact": "scripts/ci/lake_manifest_to_spdx.py", "sha256": sha256("scripts/ci/lake_manifest_to_spdx.py")},
                  {"artifact": "tools/Compliance/SbomAudit.lean", "sha256": sha256("tools/Compliance/SbomAudit.lean")},
                  {"artifact": "tools/Compliance/SbomAuditMain.lean", "sha256": sha256("tools/Compliance/SbomAuditMain.lean")},
                  {"artifact": "k7pl-lake.spdx.json", "sha256": sha256(sbom_path)},
              ],
              "audit": report,
              "negativeCases": [
                  {"case": "malformed manifest JSON", "exitCode": malformed.returncode, "status": malformed_report["status"]},
                  {"case": "mutated package revision", "exitCode": mismatch.returncode, "status": mismatch_report["status"]},
              ],
          }
          with open(evidence_path, "w", encoding="utf-8") as stream:
              json.dump(evidence, stream, indent=2, sort_keys=True)
              stream.write("\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Scoped SPDX consistency audit\n")
              summary.write("- Valid input: PASS; 14 manifest components checked.\n")
              summary.write("- Negative integration cases: malformed JSON → ERROR/2; mutated revision → FAIL/1.\n")
              summary.write("- Lean toolchain: `" + evidence["toolchain"]["lean"] + "`\n")
              summary.write("- Manifest SHA-256: `" + evidence["inputs"][0]["sha256"] + "`\n")
              summary.write("- Generated SPDX SHA-256: `" + evidence["inputs"][1]["sha256"] + "`\n")
          print("Lean scoped SPDX consistency audit and negative CLI cases: PASS")
          PY

      - name: Upload scoped SBOM audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k7pl-sbom-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k7pl-lake.spdx.json
            ${{ runner.temp }}/k7pl-sbom-audit.json
            ${{ runner.temp }}/k7pl-sbom-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Test
        run: lake test

      - name: Lint
        if: ${{ !cancelled() }}
        run: lake lint

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Implementation"
            echo "- Modules: $(find src tests -name '*.lean' | wc -l)"
            echo "- Lean: $(cat lean-toolchain)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit the axioms (K7pl)
        if: ${{ !cancelled() }}
        run: scripts/axiom-audit.sh K7pl K7pl

      # axiom-audit audits one root namespace per run and the test modules are flat (ArithTest,
      # SemanticsTest, MainTest): `--root K7plTests` matches no module and fails with "unknown
      # module prefix". The roots are read from lakefile.lean, so a new test module is audited
      # without editing this workflow; every root is audited even if an earlier one fails.
      - name: Audit the axioms (tests)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          roots="$(python3 scripts/ci/check_lean_modules.py --roots-in tests)"
          status=0
          for root in $roots; do
            echo "::group::axiom-audit $root"
            scripts/axiom-audit.sh "$root" "+$root" || {
              echo "::error::the axiom audit of $root failed"
              status=1
            }
            echo "::endgroup::"
          done
          exit "$status"

  python-tests:
    name: Tests de l'outillage Python
    if: ${{ inputs.full || inputs.python_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-pinned Python test dependencies
        run: python -m pip install --require-hashes -r scripts/requirements-ci.txt

      - name: Install hash-locked SPDX validator
        run: "python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-spdx-validator.txt"

      - name: Test the SPDX validator guard
        run: python3 scripts/ci/test_validate_spdx.py

      - name: Test the CI impact classifier
        run: python3 scripts/ci/test_impact.py

      - name: Test the Lake-to-OSV adapter
        run: python3 scripts/ci/test_lake_manifest_to_osv.py
      - name: Test the Lake-to-SPDX inventory generator
        run: python3 scripts/ci/test_lake_manifest_to_spdx.py

      - name: Test the Python tooling (mini-corpus Verso, auto-tests mutés)
        run: python3 -m pytest tests/python -q

      - name: Generate deterministic SPDX 2.3 validation input
        run: |
          python3 scripts/ci/lake_manifest_to_spdx.py \
            --created 2026-10-10T00:00:00Z \
            --output "$RUNNER_TEMP/k7pl-spdx-validation.spdx.json"

      - name: Validate SPDX 2.3 with spdx-tools
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_spdx.py "$RUNNER_TEMP/k7pl-spdx-validation.spdx.json" \
            > "$RUNNER_TEMP/k7pl-spdx-validation.json"
          python3 - "$RUNNER_TEMP/k7pl-spdx-validation.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["schemaVersion"] == "k7pl.spdx-validation/v1", report
          assert report["status"] == "PASS", report
          assert report["validator"]["name"] == "spdx-tools", report
          assert report["validator"]["version"] == "0.8.5", report
          assert report["diagnostics"] == [], report
          assert len(report["input"]["sha256"]) == 64, report
          assert isinstance(report["elapsedMs"], (int, float)), report
          assert isinstance(report["validator"]["elapsedMs"], (int, float)), report
          print("Independent SPDX 2.3 validator: PASS (spdx-tools 0.8.5)")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Independent SPDX 2.3 validation\n")
              summary.write("- Validator: \`spdx-tools 0.8.5\` (hash-locked runtime closure).\n")
              summary.write("- Result: PASS; generated JSON validated against SPDX 2.3.\n")
              summary.write("- SBOM SHA-256: \`" + report["input"]["sha256"] + "\`\n")
              summary.write("- Wrapper elapsed: \`" + str(report["elapsedMs"]) + " ms\`; validator subprocess: \`" + str(report["validator"]["elapsedMs"]) + " ms\`.\n")
          PY

      - name: Upload independent SPDX validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k7pl-independent-spdx-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k7pl-spdx-validation.spdx.json
            ${{ runner.temp }}/k7pl-spdx-validation.json
          retention-days: 14
          if-no-files-found: error

      - name: Check the real corpus with the tooling under test
        run: python3 scripts/controle.py

  spec:
    name: Spécification Verso
    if: ${{ inputs.full || inputs.spec_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_date_epoch: ${{ steps.source-date.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Commit date of the checked-out source, handed to `spec-pdf` (which has no checkout) as
      # SOURCE_DATE_EPOCH. On a `pull_request` event the checkout is GitHub's synthetic merge
      # commit, so the date is that of the merge computation, not of the last commit of the branch.
      - name: Record the commit date of the source
        id: source-date
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          case "$epoch" in
            ''|*[!0-9]*)
              echo "::error::unexpected commit date: '$epoch'"
              exit 1
              ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      - name: Install elan
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Restore the Lake dependencies
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Register the Lean problem matcher
        run: echo "::add-matcher::.github/lean-problem-matcher.json"

      - name: Register the specification warning matcher
        run: echo "::add-matcher::.github/lean-spec-warning-problem-matcher.json"

      - name: Build the specification
        run: lake build Spec

      - name: Audit the axioms (Spec)
        run: scripts/axiom-audit.sh Spec Spec

      # SpecExt and SpecBib are separate roots: `--root Spec` does not cover them.
      - name: Audit the axioms (SpecExt)
        if: ${{ !cancelled() }}
        run: scripts/axiom-audit.sh SpecExt SpecExt

      - name: Audit the axioms (SpecBib)
        if: ${{ !cancelled() }}
        run: scripts/axiom-audit.sh SpecBib SpecBib

      - name: Render the specification (HTML and TeX)
        run: lake exe spec --output _out/spec --with-tex

      - name: Validate generated HTML image assets
        run: python3 scripts/ci/check_spec_html_assets.py _out/spec/html-multi

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Specification"
            echo "- HTML pages: $(find _out/spec/html-multi -name '*.html' 2>/dev/null | wc -l)"
            echo "- Verso modules: $(find spec -name '*.lean' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the specification (HTML)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-html
          path: _out/spec/html-multi
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (TeX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-tex
          path: _out/spec/tex
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (GitHub Pages)
        if: ${{ inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/spec/html-multi

  spec-pdf:
    name: PDF de la spécification
    if: ${{ inputs.full || inputs.spec_build }}
    needs: spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TECTONIC_VERSION: 0.15.0
      TECTONIC_SHA256: dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spec-tex
          path: _out/spec/tex

      - name: Install Tectonic
        shell: bash
        run: |
          set -euo pipefail
          archive="tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@${TECTONIC_VERSION}/$archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/tectonic" "$RUNNER_TEMP/tectonic-bin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Cache Tectonic files
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          # An exact hit is never rewritten: the key follows the sources, so that a new LaTeX
          # package pulled in by the specification is saved by the next run.
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-${{ hashFiles('tools/SpecExt/**', 'tools/SpecMain.lean', 'lake-manifest.json') }}
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      # SOURCE_DATE_EPOCH and `-Z deterministic-mode` remove two known sources of variation (the
      # build date and absolute paths). They do not pin the TeX bundle, which Tectonic downloads
      # at run time, and nothing here compares two builds.
      - name: Compile the PDF
        working-directory: _out/spec/tex
        env:
          SOURCE_DATE_EPOCH: ${{ needs.spec.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*)
              echo "::error::SOURCE_DATE_EPOCH is not a number: '$SOURCE_DATE_EPOCH'"
              exit 1
              ;;
          esac
          tectonic -X compile --keep-logs -Z deterministic-mode main.tex
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp main.pdf "$GITHUB_WORKSPACE/out/k7pl-spec.pdf"

      # Informative only: no healthy build has been observed yet, so no threshold is enforced.
      - name: Summarise the compilation log
        if: ${{ !cancelled() }}
        run: |
          log=_out/spec/tex/main.log
          {
            echo "### PDF compilation log"
            if [ -f "$log" ]; then
              echo "- Lines in the log: $(wc -l < "$log")"
              echo "- Lines containing 'Warning': $(grep -a -c 'Warning' "$log" || true)"
              echo "- Lines containing 'Undefined' or 'undefined': $(grep -a -c -i 'undefined' "$log" || true)"
              echo "- Lines containing 'Missing character': $(grep -a -c 'Missing character' "$log" || true)"
            else
              echo "- No log found at $log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the compilation log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-pdf-log
          path: _out/spec/tex/main.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the specification (PDF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-pdf
          path: out/k7pl-spec.pdf
          retention-days: 90
          if-no-files-found: error

  verification-result:
    name: Résultat de la vérification
    if: always()
    needs: [quick, impl, python-tests, spec, spec-pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept successful or intentionally skipped jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::un contrôle requis a échoué ou a été interrompu ($result)"
                exit 1
                ;;
            esac
          done
