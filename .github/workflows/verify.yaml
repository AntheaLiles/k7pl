name: Verification

on:
  workflow_call:
    inputs:
      full:
        description: "Exécuter toutes les validations"
        required: false
        type: boolean
        default: false
      docs_links:
        description: "Contrôler les liens Markdown"
        required: false
        type: boolean
        default: false
      spec_check:
        description: "Exécuter les contrôles statiques de la spécification"
        required: false
        type: boolean
        default: false
      spec_build:
        description: "Compiler et rendre la spécification"
        required: false
        type: boolean
        default: false
      lean_build:
        description: "Compiler, tester et auditer l'implémentation Lean"
        required: false
        type: boolean
        default: false
      python_tests:
        description: "Exécuter les tests de l'outillage Python"
        required: false
        type: boolean
        default: false
      tracking_views:
        description: "Vérifier les vues de suivi générées"
        required: false
        type: boolean
        default: false
      deploy_pages:
        description: "Publier la spécification sur GitHub Pages après validation"
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Restaurer les caches Lake et Tectonic (false : construction à froid, par exemple pour une release)"
        required: false
        type: boolean
        default: true

# Every job only reads the repository (checkout). The Pages deployment, which writes, is a job of
# ci.yaml, not of this reusable workflow.
permissions:
  contents: read # checkout

env:
  # The isolated Lake workspace of the Paperproof extractor. scripts/ci/check_manifest.py
  # (PAPERPROOF_DIRECTORY) and build_proof_visualizations.py (DEFAULT_EXTRACTOR_DIR) name it too.
  PAPERPROOF_WORKSPACE: tools/paperproof-export

jobs:
  quick:
    name: Contrôles rapides
    if: ${{ inputs.full || inputs.docs_links || inputs.spec_check || inputs.tracking_views }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Check documentation architecture
        run: deno run --allow-read tools/ci-controller/src/documentation_architecture.ts

      - name: Check the specification
        if: ${{ inputs.full || inputs.spec_check }}
        run: python3 scripts/controle.py --format github

      - name: Check the local links
        if: ${{ inputs.full || inputs.docs_links }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  impl:
    name: Implémentation Lean
    if: ${{ inputs.full || inputs.lean_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # elan, the toolchain, the .lake/packages cache (its own key: the spec job builds other
      # packages) and the Mathlib binary cache, which this job fetches even without use_cache.
      - name: Set up Lean
        id: lean
        uses: ./.github/actions/setup-lean
        with:
          lake-cache-key: ${{ inputs.use_cache && format('lake-deps-impl-{0}', hashFiles('lake-manifest.json', 'lean-toolchain')) || '' }}
          mathlib-cache: "true"

      # Same Deno pin as the controller-shadow job in ci.yaml.
      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      # A Lean file that no lean_lib/lean_exe root reaches is never compiled by `lake build`. The
      # Deno port scans src/, tests/, tools/ and spec/ using the declared roots; separate Lake
      # workspaces such as spec/formal-chain/ are reported and excluded.
      # The check sits right before the build, after the Mathlib cache: the steps that run even
      # after a failure (lint, audits) must not start from a cold Mathlib. The Python port remains
      # in-tree until the Deno migration has passed a full green cycle.
      - name: Check that every Lean file is built
        run: deno run --allow-read tools/ci-controller/src/lean_modules.ts

      - name: Register the Lean problem matcher
        run: echo "::add-matcher::.github/lean-problem-matcher.json"

      - name: Build the implementation and the tests
        run: lake build K7pl K7plTests K7plCompliance sbomAudit

      # Generate both inventories and the Lean audit report, then let the Deno evidence
      # checker validate the report, replay four negative inputs through `lake exe sbomAudit`,
      # check Paperproof's separate manifest/SPDX pair, and write the evidence JSON and job summary.
      # The old shell/Python orchestrator remains in-tree during the staged migration.
      - name: Audit the scoped Lake-to-SPDX inventory
        shell: bash
        run: |
          set -euo pipefail
          deno run --allow-read --allow-write --allow-env=SOURCE_DATE_EPOCH tools/ci-controller/src/lake_to_spdx.ts --created 2026-10-10T00:00:00Z --output "$RUNNER_TEMP/k7pl-lake.spdx.json"
          deno run --allow-read --allow-write --allow-env=SOURCE_DATE_EPOCH tools/ci-controller/src/lake_to_spdx.ts --manifest "$PAPERPROOF_WORKSPACE/lake-manifest.json" --created 2026-10-10T00:00:00Z --output "$RUNNER_TEMP/k7pl-paperproof-export-lake.spdx.json"
          lake exe sbomAudit lake-manifest.json "$RUNNER_TEMP/k7pl-lake.spdx.json" > "$RUNNER_TEMP/k7pl-sbom-audit.json"
          deno run --allow-read --allow-write --allow-run=lake --allow-env=GITHUB_ACTIONS,GITHUB_EVENT_PATH,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW,GITHUB_SHA,GITHUB_STEP_SUMMARY tools/ci-controller/src/sbom_evidence.ts --report "$RUNNER_TEMP/k7pl-sbom-audit.json" --manifest lake-manifest.json --sbom "$RUNNER_TEMP/k7pl-lake.spdx.json" --extra-inventory "$PAPERPROOF_WORKSPACE/lake-manifest.json" "$RUNNER_TEMP/k7pl-paperproof-export-lake.spdx.json" --output "$RUNNER_TEMP/k7pl-sbom-evidence.json"

      - name: Upload scoped SBOM audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k7pl-sbom-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k7pl-lake.spdx.json
            ${{ runner.temp }}/k7pl-paperproof-export-lake.spdx.json
            ${{ runner.temp }}/k7pl-sbom-audit.json
            ${{ runner.temp }}/k7pl-sbom-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Test
        run: lake test

      - name: Lint
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: lake lint

      - name: Summary
        if: ${{ !cancelled() }}
        run: bash scripts/ci/verify_summary.sh implementation

      - name: Audit the axioms (K7pl)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit K7pl K7pl

      # axiom-audit imports the module named by its root and audits that module and its
      # submodules. There is no `Compliance` module, so `--root Compliance` cannot be used: every
      # Compliance.* root of tools/ in lakefile.lean is audited, the roots of K7plCompliance
      # (Compliance.SbomAudit; RequirementEvidence was deleted in the CI tranche 2, its
      # traceability model transcribed into the proof-evidence schema) and of the sbomAudit
      # CLI (Compliance.SbomAuditMain). A new root is audited without editing this workflow.
      - name: Audit the axioms (compliance tooling)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit-roots tools Compliance

      # axiom-audit audits one root namespace per run and the test modules are flat (ArithTest,
      # SemanticsTest, MainTest): `--root K7plTests` matches no module and fails with "unknown
      # module prefix". The roots are read from lakefile.lean, so a new test module is audited
      # without editing this workflow; every root is audited even if an earlier one fails.
      - name: Audit the axioms (tests)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit-roots tests

  python-tests:
    name: Tests de l'outillage Python
    if: ${{ inputs.full || inputs.python_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-pinned Python test dependencies
        run: python -m pip install --require-hashes -r scripts/requirements-ci.txt

      - name: Install hash-locked SPDX validator
        run: "python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-spdx-validator.txt"

      # Every test_*.py of scripts/ci, subpackages with an __init__.py included (navigation_graph),
      # under this job's Python and with the hash-locked SPDX validator installed. A new test file
      # is picked up without editing this workflow.
      - name: Test the CI scripts
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Test the Python tooling (mini-corpus Verso, auto-tests mutés)
        run: python3 -m pytest tests/python -q

      - name: Generate deterministic SPDX 2.3 validation input
        run: |
          set -euo pipefail
          python3 scripts/ci/lake_manifest_to_spdx.py \
            --created 2026-10-10T00:00:00Z \
            --output "$RUNNER_TEMP/k7pl-spdx-validation.spdx.json"
          python3 scripts/ci/lake_manifest_to_spdx.py \
            --manifest "$PAPERPROOF_WORKSPACE/lake-manifest.json" \
            --created 2026-10-10T00:00:00Z \
            --output "$RUNNER_TEMP/k7pl-paperproof-export-spdx-validation.spdx.json"

      - name: Validate SPDX 2.3 with spdx-tools
        run: bash scripts/ci/verify_validate_spdx.sh

      - name: Measure repeated SPDX validation cost
        run: |
          set -euo pipefail
          python3 scripts/ci/benchmark_spdx_validator.py \
            "$RUNNER_TEMP/k7pl-spdx-validation.spdx.json" \
            --repetitions 5 \
            --output "$RUNNER_TEMP/k7pl-spdx-validation-benchmark.json"

      - name: Probe the SPDX validator against exploratory negative cases (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/ci/evaluate_spdx_negative_corpus.py \
            --input "$RUNNER_TEMP/k7pl-spdx-validation.spdx.json" \
            --output "$RUNNER_TEMP/k7pl-spdx-negative-probes.json"

      - name: Upload independent SPDX validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k7pl-independent-spdx-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k7pl-spdx-validation.spdx.json
            ${{ runner.temp }}/k7pl-spdx-validation.json
            ${{ runner.temp }}/k7pl-paperproof-export-spdx-validation.spdx.json
            ${{ runner.temp }}/k7pl-paperproof-export-spdx-validation.json
            ${{ runner.temp }}/k7pl-spdx-validation-benchmark.json
            ${{ runner.temp }}/k7pl-spdx-negative-probes.json
          retention-days: 14
          if-no-files-found: error

      - name: Check the real corpus with the tooling under test
        run: python3 scripts/controle.py

  tikz-assets:
    name: TikZ figure assets
    if: ${{ inputs.full || inputs.spec_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poppler SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      # Version and SHA-256 are recorded in the action, once for both Tectonic jobs.
      - name: Install pinned Tectonic
        id: tectonic
        uses: ./.github/actions/setup-tectonic

      # The TikZ and PDF jobs pull different LaTeX packages: each has its own key prefix. With a
      # shared key, the first job to save made the other one's exact hit, and that job never saved
      # its own packages.
      - name: Cache Tectonic files
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: tectonic-tikz-${{ runner.os }}-${{ steps.tectonic.outputs.version }}-${{ hashFiles('tools/SpecExt/**', 'tools/SpecMain.lean', 'lake-manifest.json', 'spec/figures/tikz/**') }}
          restore-keys: |
            tectonic-tikz-${{ runner.os }}-${{ steps.tectonic.outputs.version }}-

      - name: Generate TikZ figures
        env:
          TECTONIC_BIN_DIR: ${{ steps.tectonic.outputs.bin-dir }}
        run: PATH="$TECTONIC_BIN_DIR:$PATH" bash scripts/ci/build_tikz_figures.sh

      - name: Validate generated TikZ figure assets
        run: python3 scripts/ci/check_tikz_figures.py --generated out/tikz-production

      - name: Upload generated TikZ figure assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tikz-figure-assets
          path: out/tikz-production/*
          retention-days: 14
          if-no-files-found: error

      - name: Summarise TikZ figure assets
        if: ${{ success() }}
        env:
          TECTONIC_VERSION: ${{ steps.tectonic.outputs.version }}
        run: bash scripts/ci/verify_summary.sh tikz

  spec:
    name: Spécification Verso
    needs: tikz-assets
    if: ${{ inputs.full || inputs.spec_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_date_epoch: ${{ steps.source-date.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Commit date of the checked-out source, handed to `spec-pdf` (which has no checkout) as
      # SOURCE_DATE_EPOCH. On a `pull_request` event the checkout is GitHub's synthetic merge
      # commit, so the date is that of the merge computation, not of the last commit of the branch.
      - name: Record the commit date of the source
        id: source-date
        run: bash scripts/ci/verify_source_date_epoch.sh

      # As in impl, with its own .lake/packages cache key; without use_cache (release builds), the
      # Mathlib binary cache is not fetched either.
      - name: Set up Lean
        id: lean
        uses: ./.github/actions/setup-lean
        with:
          lake-cache-key: ${{ inputs.use_cache && format('lake-deps-spec-{0}', hashFiles('lake-manifest.json', 'lean-toolchain')) || '' }}
          mathlib-cache: ${{ inputs.use_cache }}

      # Same Deno pin as the controller-shadow job in ci.yaml.
      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Register the Lean problem matcher
        run: echo "::add-matcher::.github/lean-problem-matcher.json"

      - name: Register the specification warning matcher
        run: echo "::add-matcher::.github/lean-spec-warning-problem-matcher.json"

      - name: Build the specification
        run: lake build Spec

      # The B/C/D prototypes (tools/prototypes-bcd/) are a non-default lean_lib that `Spec` does not
      # import. check_lean_modules.py counts their roots as reachable, so this job builds them.
      - name: Build the B/C/D prototypes
        run: lake build K7plPrototypes

      - name: Audit the axioms (Spec)
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit Spec Spec

      - name: Audit the axioms (Spec.C3.EffectiveKernel)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit Spec.C3.EffectiveKernel Spec

      # SpecExt and SpecBib are separate roots: `--root Spec` does not cover them.
      - name: Audit the axioms (SpecExt)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit SpecExt SpecExt

      - name: Audit the axioms (SpecBib)
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/axiom_audit.ts audit SpecBib SpecBib

      - name: Download generated TikZ figure assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tikz-figure-assets
          path: spec/figures

      # Offline checks of the workspace's manifest (its own allow-list, pins and toolchain) before
      # `lake exe cache get` clones and runs code from the packages it names.
      - name: Set up Deno for manifest validation
        uses: ./.github/actions/setup-deno

      - name: Check the Paperproof workspace manifest
        run: deno run --allow-read --allow-env=GITHUB_ACTIONS tools/ci-controller/src/manifest.ts --manifest "$PAPERPROOF_WORKSPACE/lake-manifest.json"

      # Keyed on the workspace's own manifest and toolchain: its packages differ from the root's.
      - name: Restore the Paperproof workspace's Lake packages
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PAPERPROOF_WORKSPACE }}/.lake/packages
          key: lake-deps-paperproof-${{ hashFiles(format('{0}/lake-manifest.json', env.PAPERPROOF_WORKSPACE), format('{0}/lean-toolchain', env.PAPERPROOF_WORKSPACE)) }}

      - name: Restore pinned Paperproof extraction dependencies
        working-directory: ${{ env.PAPERPROOF_WORKSPACE }}
        run: lake exe cache get

      - name: Extract structured proof observations for Verso
        run: >-
          python3 scripts/ci/build_proof_visualizations.py
          --repo-root .
          --data-dir _out/proof-visualizations/data
          --ref "$GITHUB_SHA"
          --extractor-dir "$PAPERPROOF_WORKSPACE"

      - name: Render the specification (HTML and TeX)
        run: lake exe spec --output _out/spec --with-tex

      - name: Enrich published SVGs with accessible names and descriptions
        run: python3 scripts/ci/enrich_figure_svg_metadata.py --html-root _out/spec/html-multi

      - name: Generate the navigable figure-provenance catalog
        run: python3 scripts/ci/build_figure_provenance.py --output _out/spec/html-multi/navigation/figures.html

      - name: Generate the local semantic graph prototype (C6)
        run: >-
          python3 scripts/ci/build_semantic_graph.py
          --output _out/spec/html-multi/navigation/semantic-graph.html
          --peer-graph semantic-graph-c3.html
          --peer-title "Graphe du système gradué (C3)"

      - name: Generate the local semantic graph prototype (C3)
        run: >-
          python3 scripts/ci/build_semantic_graph.py
          --output _out/spec/html-multi/navigation/semantic-graph-c3.html
          --source spec/Spec/C3/LeSystemeGradue.lean
          --label sec:c3-le-systeme-gradue
          --start-line 22
          --end-line 50
          --peer-graph semantic-graph.html
          --peer-title "Graphe du processus de compilation (C6)"

      - name: Generate the interactive navigation graph
        run: >-
          python3 scripts/ci/navigation_graph/build_navigation_graph.py
          --site _out/spec/html-multi
          --ref "$GITHUB_SHA"

      - name: Validate the interactive navigation graph
        run: >-
          python3 scripts/ci/navigation_graph/check_navigation_graph_output.py
          --site _out/spec/html-multi
          --ref "$GITHUB_SHA"

      - name: Validate navigation links, anchors, provenance and freshness
        run: >-
          python3 scripts/ci/check_navigation_outputs.py
          --html-root _out/spec/html-multi
          --ref "$GITHUB_SHA"

      - name: Validate generated HTML image assets
        run: python3 scripts/ci/check_spec_html_assets.py _out/spec/html-multi


      - name: Summary
        if: ${{ !cancelled() }}
        run: bash scripts/ci/verify_summary.sh specification

      - name: Upload the specification (HTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-html
          path: _out/spec/html-multi
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (TeX)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-tex
          path: _out/spec/tex
          retention-days: 14
          if-no-files-found: error

      - name: Upload the specification (GitHub Pages)
        if: ${{ inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/spec/html-multi

  spec-pdf:
    name: PDF de la spécification
    if: ${{ inputs.full || inputs.spec_build }}
    needs: spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-tex
          path: _out/spec/tex

      - name: Install Tectonic
        id: tectonic
        uses: ./.github/actions/setup-tectonic

      - name: Cache Tectonic files
        if: ${{ inputs.use_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          # An exact hit is never rewritten: the key follows the sources, so that a new LaTeX
          # package pulled in by the specification is saved by the next run. The prefix differs from
          # the TikZ job's (see there).
          key: tectonic-pdf-${{ runner.os }}-${{ steps.tectonic.outputs.version }}-${{ hashFiles('tools/SpecExt/**', 'tools/SpecMain.lean', 'lake-manifest.json', 'spec/figures/tikz/**') }}
          restore-keys: |
            tectonic-pdf-${{ runner.os }}-${{ steps.tectonic.outputs.version }}-

      # SOURCE_DATE_EPOCH and `-Z deterministic-mode` remove two known sources of variation (the
      # build date and absolute paths). They do not pin the TeX bundle, which Tectonic downloads
      # at run time, and nothing here compares two builds.
      - name: Compile the PDF
        working-directory: _out/spec/tex
        env:
          SOURCE_DATE_EPOCH: ${{ needs.spec.outputs.source_date_epoch }}
          TECTONIC_BIN_DIR: ${{ steps.tectonic.outputs.bin-dir }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/verify_compile_pdf.sh"

      - name: Reject unresolved index page references
        working-directory: _out/spec/tex
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/verify_check_index_references.sh"

      # Informative only: no healthy build has been observed yet, so no threshold is enforced.
      - name: Summarise the compilation log
        if: ${{ !cancelled() }}
        run: bash scripts/ci/verify_summary.sh pdf-log

      - name: Upload the compilation log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-pdf-log
          path: _out/spec/tex/main.log
          retention-days: 14
          # F2, owner decision 2026-10-25: a missing compilation
          # log must fail, not warn silently, like the PDF itself
          # (already error below).
          if-no-files-found: error

      - name: Upload the specification (PDF)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-pdf
          path: out/k7pl-spec.pdf
          retention-days: 90
          if-no-files-found: error

  verification-result:
    name: Résultat de la vérification
    if: always()
    needs: [quick, impl, python-tests, tikz-assets, spec, spec-pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept successful or intentionally skipped jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::un contrôle requis a échoué ou a été interrompu ($result)"
                exit 1
                ;;
            esac
          done
