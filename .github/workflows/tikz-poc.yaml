name: TikZ figure POC

on:
  pull_request:
    paths:
      - ".github/workflows/tikz-poc.yaml"
      - "docs/tracking/tikz-poc/**"
      - "scripts/ci/build_tikz_poc.sh"
      - "scripts/ci/check_tikz_poc.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tikz-poc.yaml"
      - "docs/tracking/tikz-poc/**"
      - "scripts/ci/build_tikz_poc.sh"
      - "scripts/ci/check_tikz_poc.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikz-poc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Compile, convert and compare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TECTONIC_VERSION: 0.15.0
      TECTONIC_SHA256: dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407
      SOURCE_DATE_EPOCH: "946684800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poppler SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install pinned Tectonic
        shell: bash
        run: |
          set -euo pipefail
          archive="tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@${TECTONIC_VERSION}/$archive"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$url" --output "$RUNNER_TEMP/$archive"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/tectonic" "$RUNNER_TEMP/tectonic-bin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build twice and validate deterministic outputs
        run: scripts/ci/build_tikz_poc.sh

      - name: Upload PDF and SVG proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tikz-poc-renderings
          path: out/tikz-poc/*
          retention-days: 14
          if-no-files-found: error

      - name: Summarise render hashes
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### TikZ POC"
            echo "Tectonic: ${TECTONIC_VERSION} (SHA-256 checked)"
            echo "SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}"
            echo 'PDF/SVG pairs compiled twice and compared byte-for-byte.'
            sha256sum out/tikz-poc/*.pdf out/tikz-poc/*.svg
          } >> "$GITHUB_STEP_SUMMARY"
