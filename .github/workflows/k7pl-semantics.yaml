name: K7PL formal semantics

on:
  pull_request:
    paths:
      - "src/k/**"
      - "tests/examples/**"
      - "docs/formal-semantics.md"
      - "proofs/**"
      - "spec/formal-chain/**"
      - "scripts/ci/test_code_artifact_contract.py"
      - "spec/Spec.lean"
      - "spec/Spec/**"
      - "tools/**"
      - "Makefile"
      - "scripts/ci/patch_klean_prelude.py"
      - "scripts/ci/test_patch_klean_prelude.py"
      - "scripts/ci/k7pl_semantics_*.sh"
      - "REUSE.toml"
      - ".github/workflows/k7pl-semantics.yaml"
  push:
    branches: [main]
    paths:
      - "src/k/**"
      - "tests/examples/**"
      - "docs/formal-semantics.md"
      - "proofs/**"
      - "spec/formal-chain/**"
      - "scripts/ci/test_code_artifact_contract.py"
      - "spec/Spec.lean"
      - "spec/Spec/**"
      - "tools/**"
      - "Makefile"
      - "scripts/ci/patch_klean_prelude.py"
      - "scripts/ci/test_patch_klean_prelude.py"
      - "scripts/ci/k7pl_semantics_*.sh"
      - "REUSE.toml"
      - ".github/workflows/k7pl-semantics.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k-smoke:
    name: Compile K semantics, execute examples, export to Lean
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: runtimeverificationinc/kframework-k:ubuntu-jammy-7.1.337
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository-pinned Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false

      - name: Fetch the Mathlib cache for the root Verso build
        run: lake exe cache get

      - name: Record K toolchain
        run: bash scripts/ci/k7pl_semantics_record_toolchain.sh

      - name: Test Verso executable-code extraction contract
        run: python3 scripts/ci/test_code_artifact_contract.py

      - name: Compile K definition and run examples
        run: make -C src/k check

      - name: Install the pinned Klean generator
        shell: bash
        run: bash scripts/ci/k7pl_semantics_install_klean.sh

      - name: Export the compiled KORE definition to Lean
        id: export_lean
        shell: bash
        run: bash scripts/ci/k7pl_semantics_export_lean.sh

      - name: Test and apply the pinned Klean/Lean compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/scripts/ci" -p test_patch_klean_prelude.py
          python3 "$GITHUB_WORKSPACE/scripts/ci/patch_klean_prelude.py" \
            "$RUNNER_TEMP/klean-output/k7pl2lean/K7PL2Lean/Prelude.lean" \
            | tee "$GITHUB_WORKSPACE/.formal-chain-evidence/klean-patch-report.txt"

      - name: Stage generated Klean modules into the maintained proof project
        shell: bash
        run: bash scripts/ci/k7pl_semantics_stage_klean.sh

      - name: Build the Klean-generated Lean project
        shell: bash
        working-directory: ${{ github.workspace }}/proofs
        run: bash "$GITHUB_WORKSPACE/scripts/ci/k7pl_semantics_build_proofs.sh"

      - name: Render Verso Blueprint documentation
        id: blueprint
        shell: bash
        working-directory: ${{ github.workspace }}/spec/formal-chain
        run: bash "$GITHUB_WORKSPACE/scripts/ci/k7pl_semantics_render_blueprint.sh"

      - name: Package formal-chain build evidence
        if: ${{ success() && steps.export_lean.outcome == 'success' && steps.blueprint.outcome == 'success' }}
        shell: bash
        run: bash scripts/ci/k7pl_semantics_package_evidence.sh

      - name: Upload formal-chain sources, HTML, and evidence
        if: ${{ success() && steps.export_lean.outcome == 'success' && steps.blueprint.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k7pl-formal-chain-${{ github.run_id }}
          path: ${{ runner.temp }}/k7pl-formal-chain-${{ github.run_id }}.tar.gz
          retention-days: 14
          if-no-files-found: error
