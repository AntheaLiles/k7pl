name: Conventional Commits

on: [push, pull_request]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les messages de commit
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yaml
