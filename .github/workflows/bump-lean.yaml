# Opens a pull request when Lean, Mathlib, CSLib and Verso share a newer release.
#
# The work is split in two jobs so that BUMP_TOKEN never reaches a machine that ran upstream code:
#
#   build    contents: read, no secret. Runs the version computation, scripts/bump-lean.sh,
#            `lake update`, the build and the tests. `lake update` and `lake build` execute code
#            from the newly resolved upstream revisions. Its only product is lake-manifest.json,
#            handed over as an artifact.
#   open-pr  contents: read, environment `bump-lean`, holds BUMP_TOKEN. Runs NO Lean code. From a
#            clean checkout it regenerates lean-toolchain and lakefile.lean with the repository's
#            own script, treats the artifact as untrusted data (scripts/ci/check_manifest.py),
#            checks that exactly the three expected files differ, and only then opens the pull
#            request.
#
# What open-pr checks in the manifest (scripts/ci/check_manifest.py --check-tags
# --check-upstream), and nothing else:
#   - structure: only keys of a Lake manifest and of a Lake package; packagesDir, lakeDir and name
#     fixed; version and fixedToolchain well formed; every package a Git dependency; subDir and scope
#     plain relative paths (no `..`, no absolute path); configFile lakefile.lean or lakefile.toml;
#     manifestFile lake-manifest.json; inputRev a plain name, never `refs/...`, no `..`;
#   - identity: every package is one of the 14 known names, taken from the manifest of 6 October
#     2026 (ALLOWED_PACKAGES), and comes from the one GitHub repository recorded for that name;
#     a new transitive dependency therefore fails until a human adds it to the script;
#   - pins: every rev is 40 lowercase hex digits; lean-toolchain and the three `@ "vX.Y.Z"`
#     requirements of lakefile.lean name the same release; the non-inherited packages are exactly
#     the lakefile's requirements, with the same URL and inputRev;
#   - upstream tags (network): each direct dependency's rev is the commit of its upstream tag;
#   - upstream manifests (network): for each direct dependency whose tag check passed, the
#     lake-manifest.json committed upstream at that rev is fetched, and every inherited package
#     must be listed by one of them with the same name, URL and rev.
# NOT checked: a package that the manifest omits; a malicious commit that an upstream manifest
# itself pins; an upstream tag moved before the bump. The reviewer of the pull request still reads
# the diff of lake-manifest.json.
#
# The isolated Paperproof extraction workspace (PAPERPROOF_WORKSPACE below) is NOT bumped: its
# toolchain, Mathlib and Paperproof revision are pinned together for Paperproof compatibility and
# move by a reviewed, manual change. The build summary and the pull request body state both
# toolchains, so that the divergence a bump creates is visible; nothing here blocks the bump.
#
# A pull request opened with GITHUB_TOKEN does not trigger the other workflows; BUMP_TOKEN is
# therefore required so that the generated pull request receives the normal CI checks. The
# GITHUB_TOKEN of this workflow is read-only and is not used to write anything.
name: Bump Lean

on:
  schedule:
    - cron: "43 5 3 * *"
  workflow_dispatch:

# Read only: the pull request is opened with BUMP_TOKEN, never with GITHUB_TOKEN (see above).
permissions:
  contents: read # checkout

concurrency:
  group: bump-lean
  cancel-in-progress: false

env:
  # The isolated Lake workspace of the Paperproof extractor (not bumped, see above).
  PAPERPROOF_WORKSPACE: tools/paperproof-export

jobs:
  build:
    name: Bump, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Executes upstream code: no write permission, no secret.
    permissions:
      contents: read
    outputs:
      current: ${{ steps.version.outputs.current }}
      latest: ${{ steps.version.outputs.latest }}
      newer: ${{ steps.version.outputs.newer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the latest common release
        id: version
        run: bash scripts/ci/bump_lean_find_version.sh

      - name: Update the toolchain and the requirements
        if: steps.version.outputs.newer == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: scripts/bump-lean.sh --no-update "$LATEST"

      # elan and the bumped toolchain only: no Actions cache, and the Mathlib cache is fetched
      # after `lake update` (below), for the new revisions.
      - name: Set up Lean
        if: steps.version.outputs.newer == 'true'
        uses: ./.github/actions/setup-lean

      - name: Resolve the dependencies
        if: steps.version.outputs.newer == 'true'
        run: lake update

      # Early check, and it blocks: a failure stops this job before the build. It runs after
      # `lake update` evaluated upstream code in this workspace, so it is not authoritative: the
      # authoritative check is made by the open-pr job on a clean checkout.
      - name: Check the resolved manifest (early)
        if: steps.version.outputs.newer == 'true'
        run: python3 scripts/ci/check_manifest.py

      - name: Build and test
        if: steps.version.outputs.newer == 'true'
        run: bash scripts/ci/bump_lean_build_and_test.sh

      # Only the manifest leaves this job. lean-toolchain and lakefile.lean are regenerated by
      # open-pr, never taken from here.
      - name: Hand over the resolved manifest
        if: steps.version.outputs.newer == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-manifest
          path: lake-manifest.json
          retention-days: 3
          if-no-files-found: error

  open-pr:
    name: Open the pull request
    needs: build
    if: needs.build.outputs.newer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bump-lean
    # BUMP_TOKEN is passed to create-pull-request explicitly; this job needs no GITHUB_TOKEN write.
    permissions:
      contents: read
    env:
      LATEST: ${{ needs.build.outputs.latest }}
      CURRENT: ${{ needs.build.outputs.current }}
    steps:
      - name: Require a token that triggers the normal PR workflows
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$BUMP_TOKEN" ] || {
            echo "::error::BUMP_TOKEN est requis pour créer une PR soumise à la CI normale."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the version
        run: bash scripts/ci/bump_lean_validate_versions.sh

      - name: Regenerate lean-toolchain and lakefile.lean
        run: scripts/bump-lean.sh --no-update "$LATEST"

      # Read from this clean checkout, for the pull request body only. The format is checked so
      # that nothing but a toolchain name reaches the body.
      - name: Record the toolchain of the Paperproof workspace (not bumped)
        id: paperproof
        run: bash scripts/ci/bump_lean_paperproof_toolchain.sh

      - name: Download the resolved manifest (untrusted)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lake-manifest
          path: ${{ runner.temp }}/untrusted

      - name: Validate the manifest and put it in place
        run: bash scripts/ci/bump_lean_validate_manifest.sh

      - name: Check that exactly the expected files differ
        run: bash scripts/ci/bump_lean_check_diff.sh

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          branch: bump/lean-${{ env.LATEST }}
          commit-message: "build(deps): bump Lean, Mathlib, CSLib and Verso to ${{ env.LATEST }}"
          title: "build(deps): bump Lean, Mathlib, CSLib and Verso to ${{ env.LATEST }}"
          body: |
            Montée de version groupée de `${{ env.CURRENT }}` vers `${{ env.LATEST }}`
            (`lean-toolchain`, `lakefile.lean`, `lake-manifest.json`).

            `lean-toolchain` et `lakefile.lean` sont régénérés par `scripts/bump-lean.sh` ; `lake-manifest.json`
            vient du job `build` (qui a exécuté du code amont) et a été validé par
            `scripts/ci/check_manifest.py --check-tags --check-upstream` avant l'ouverture de cette PR.
            `lake build` et `lake test` passent dans le job `build` du workflow qui a ouvert cette PR.
            Penser à ajouter une ligne dans `CHANGELOG.md`.

            The isolated Paperproof extraction workspace (`${{ env.PAPERPROOF_WORKSPACE }}`) is not
            bumped: it stays on `${{ steps.paperproof.outputs.toolchain }}`, pinned with its Mathlib and
            Paperproof revision for Paperproof compatibility. Once merged, the K7PL toolchain
            (`leanprover/lean4:${{ env.LATEST }}`) and the extractor's differ until a person bumps that
            workspace after checking Paperproof; the proof-visualization artifacts record both.
          add-paths: |
            lean-toolchain
            lakefile.lean
            lake-manifest.json
