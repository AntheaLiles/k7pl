name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Re-check the current Lake dependency revisions weekly, even when no code changes.
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  badge-source-coherence:
    name: Check BadgeApp source metadata and proposal safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local metadata coherence and pinned criteria registry
        run: python3 scripts/ci/check_badge_proposals.py --check-sources

  badge-criteria-drift:
    name: Detect upstream BadgeApp criteria drift
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned criteria blob IDs with upstream
        run: bash scripts/ci/security_badge_criteria_drift.sh
      - name: Preserve drift-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badge-criteria-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/badge-criteria-drift.json
          if-no-files-found: warn
          retention-days: 90
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: Audit GitHub Actions workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF results to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow definitions
        id: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ./.github/
          # A fixed analyzer version, without the online-only audits. The findings go to Code
          # Scanning, and the next step makes any of them fail this job.
          version: v1.20.0
          persona: regular
          online-audits: false
          advanced-security: true
      # With SARIF output zizmor exits 0 whatever it finds, so the gate reads the results that the
      # step above uploaded. A missing or malformed file fails the step.
      - name: Fail on any zizmor finding
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          python3 -I - "$SARIF" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              sarif = json.load(stream)
          results = [result for run in sarif["runs"] for result in run["results"]]
          for result in results:
              location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
              uri = location.get("artifactLocation", {}).get("uri", "?")
              line = location.get("region", {}).get("startLine", "?")
              print(f"{result.get('ruleId', '?')}: {uri!r}, line {line}")
          if results:
              print(f"::error::zizmor reported {len(results)} finding(s), listed above")
              sys.exit(1)
          print("zizmor reported no finding.")
          PY

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lake-osv-manifest:
    name: Prepare Lake dependencies for OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Root workspace only. tools/paperproof-export/lake-manifest.json is not scanned:
      # lake_manifest_to_osv.py checks a manifest against the root allow-list, lakefile.lean and
      # lean-toolchain, and refuses that one (Paperproof is not allowed, cslib and verso missing).
      - name: Validate and convert the Lake manifest
        run: python3 scripts/ci/lake_manifest_to_osv.py --output lake-osv-scanner.json
      - name: Upload OSV-Scanner custom lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-osv-scanner-deps
          path: lake-osv-scanner.json
          if-no-files-found: error
          retention-days: 1

  lake-osv-scan:
    name: Scan pinned Lake revisions (OSV)
    needs: lake-osv-manifest
    permissions:
      actions: read # read by the reusable workflow's SARIF upload (codeql-action#2117)
      contents: read
      security-events: write # the reusable workflow uploads its SARIF results to Code Scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.6.0
    with:
      download-artifact: lake-osv-scanner-deps
      scan-args: |-
        --lockfile=osv-scanner:lake-osv-scanner.json
      # Blocking: the scans of main before this switch reported no vulnerability. An advisory
      # published later against a pinned revision fails this job, and so `CI OK`, until the
      # dependency is bumped or the finding is assessed. The SARIF upload still runs.
      fail-on-vuln: true
      upload-sarif: true
