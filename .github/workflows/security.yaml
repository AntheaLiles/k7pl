name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Re-check the current Lake dependency revisions weekly, even when no code changes.
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  badge-source-coherence:
    name: Check BadgeApp source metadata and proposal safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local metadata coherence and pinned criteria registry
        run: python3 scripts/ci/check_badge_proposals.py --check-sources

  badge-criteria-drift:
    name: Detect upstream BadgeApp criteria drift
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned criteria blob IDs with upstream
        run: |
          set +e
          python3 scripts/ci/check_badge_proposals.py --check-upstream --report "$RUNNER_TEMP/badge-criteria-drift.json"
          result=$?
          if [ "$result" -eq 0 ]; then
            echo "OpenSSF BadgeApp criteria are unchanged from the pinned registry." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -eq 1 ]; then
            echo "::warning::OpenSSF BadgeApp criteria changed upstream; review the report and update the registry deliberately."
            echo "**Upstream criteria drift detected.** The pinned registry was not modified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not verify OpenSSF BadgeApp criteria drift; inspect the report and retry."
            echo "**Upstream check unavailable.** This is not evidence that the criteria are unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Preserve drift-check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-criteria-drift-${{ github.run_id }}
          path: ${{ runner.temp }}/badge-criteria-drift.json
          if-no-files-found: warn
          retention-days: 90
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  zizmor:
    name: Audit GitHub Actions workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow definitions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: ./.github/
          # Initial observation: keep findings visible in Code Scanning without making them
          # a merge gate; use a fixed analyzer version and disable online-only audits initially.
          version: v1.20.0
          persona: regular
          online-audits: false
          advanced-security: true

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lake-osv-manifest:
    name: Prepare Lake dependencies for OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and convert the Lake manifest
        run: python3 scripts/ci/lake_manifest_to_osv.py --output lake-osv-scanner.json
      - name: Upload OSV-Scanner custom lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lake-osv-scanner-deps
          path: lake-osv-scanner.json
          if-no-files-found: error
          retention-days: 1

  lake-osv-scan:
    name: Scan pinned Lake revisions (OSV)
    needs: lake-osv-manifest
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c7c7bcb0773cc4678a674ada03a66cc5c4325476 # v2.6.0
    with:
      download-artifact: lake-osv-scanner-deps
      scan-args: |-
        --lockfile=osv-scanner:lake-osv-scanner.json
      # First observation phase: publish findings, but do not block the only maintainer before
      # the baseline, coverage and false-positive behavior have been reviewed.
      fail-on-vuln: false
      upload-sarif: true
