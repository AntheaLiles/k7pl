name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_axiom_status:
        description: "Regenerate STATUS.md with completed K7PL axiom audit evidence"
        required: false
        type: boolean
        default: false
      axiom_source_sha:
        description: "Exact main commit covered by the formal-semantics axiom audit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  impact:
    name: Impact analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full: ${{ steps.impact.outputs.full }}
      docs_links: ${{ steps.impact.outputs.docs_links }}
      spec_check: ${{ steps.impact.outputs.spec_check }}
      spec_build: ${{ steps.impact.outputs.spec_build }}
      lean_build: ${{ steps.impact.outputs.lean_build }}
      python_tests: ${{ steps.impact.outputs.python_tests }}
      tracking_views: ${{ steps.impact.outputs.tracking_views }}
      unclassified: ${{ steps.impact.outputs.unclassified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      - name: Check, lint, format and test the Deno controller
        working-directory: tools/ci-controller
        shell: bash
        run: |
          set -euo pipefail
          deno task check
          deno task lint
          deno task fmt
          deno task test

      - name: Test the CI scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Check CI shell-script syntax
        run: find scripts/ci -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      # A pull request may change lake-manifest.json (a person, an agent), not only the one that
      # bump-lean.yaml opens. These are the offline checks: no network, no upstream code.
      - name: Check the Lake manifest
        run: deno run --allow-read --allow-env=GITHUB_ACTIONS tools/ci-controller/src/manifest.ts

      - name: Run CI impact classifier
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # scripts/ci/impact.py is the only place that decides which paths force the full validation.
        # A manual dispatch runs the full validation. The `status` job dispatches this workflow on
        # automation/generated-status (see that job): such a run classifies the branch against
        # main, as a pull request run would. The base comes from the checkout, never from an input.
        # A commit that is already on main gets the full validation, so this path never narrows the
        # checks behind a `CI OK` that a main commit carries.
        run: bash scripts/ci/ci_impact.sh

  controller-shadow:
    name: Controller shadow
    # Shadow diagnostic only, owner-approved 2026-10-25 (slice 3).
    # This job is deliberately NOT in ci-ok's needs and runs with
    # continue-on-error: a divergence is reported in its logs, it
    # never gates CI OK and never replaces the Python classifier.
    # The Python classifier in the `impact` job stays the only
    # source of truth until a cutover decision promotes the Deno
    # controller. Runs on push and pull_request only: a manual
    # dispatch has no base range for the shadow comparison.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    container:
      # Official Deno 2.9.8 Ubuntu image, pinned to its linux/amd64 manifest digest.
      # Runtime footprint is 69.48 MB; git and Python are installed for the shadow parity run.
      image: denoland/deno:ubuntu-2.9.8@sha256:f64e93f8472f01e64118d48b26297e304014c778d51aaf7e491a41cc14d0ca6d
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    steps:
      # The minimal image does not include Git; install it before checkout uses Git.
      - name: Install shadow dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git python3
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the component registry
        run: deno run --allow-read tools/ci-controller/src/main.ts validate-registry

      - name: Compare Deno and Python classifiers (shadow)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: deno run --allow-read --allow-run --allow-env --allow-write tools/ci-controller/src/main.ts classify --shadow --base "$BASE_SHA" --head "$HEAD_SHA"

  external-links:
    name: External links
    # F0, owner decision 2026-10-25: external links are checked
    # online, first as report-only (this job), then blocking after
    # an explicit cutover decision following a clean first pass.
    # Transitory form: lychee, pinned by the same full SHA already
    # used in verify.yaml (v2.9.0), WITHOUT --offline, with
    # continue-on-error. The local-link job in verify.yaml is
    # unchanged and stays strict and blocking.
    #
    # What this lychee step does NOT yet provide, and what the
    # Deno port of the external-link checker must add before the
    # blocking cutover (tracked, not silently assumed):
    #   - explicit HEAD-then-GET fallback per URL (lychee's own
    #     request handling is used here, not the specified one);
    #   - 429 handling with Retry-After honoured and capped at
    #     60 s (only lychee's generic --max-retries /
    #     --retry-wait-time are set here);
    #   - a structured JSON report artefact (this step's report
    #     is its log output);
    #   - per-URL exceptions with reason, manual verification
    #     and 90-day expiry, without wildcard or per-domain
    #     entries (transitory lychee form: lychee.toml holds
    #     per-exact-URL exclusions verified 2026-10-26, to be
    #     re-checked 2027-01-24, plus a gnu.org throttle for
    #     the 429s; the Deno checker must still implement
    #     expiry properly before the cutover);
    #   - UNVERIFIED mapped to failure (impossible to observe
    #     while the job is continue-on-error; the cutover must
    #     remove continue-on-error AND land the Deno checker).
    # Until then, a green CI does NOT mean external links were
    # verified: it means this report-only job ran.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external links (report only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --timeout 30 --max-retries 3 --retry-wait-time 5 '**/*.md'
          fail: true

  verify:
    name: Verification
    needs: impact
    uses: ./.github/workflows/verify.yaml
    with:
      full: ${{ needs.impact.outputs.full == 'true' }}
      docs_links: ${{ needs.impact.outputs.docs_links == 'true' }}
      spec_check: ${{ needs.impact.outputs.spec_check == 'true' }}
      spec_build: ${{ needs.impact.outputs.spec_build == 'true' }}
      lean_build: ${{ needs.impact.outputs.lean_build == 'true' }}
      python_tests: ${{ needs.impact.outputs.python_tests == 'true' }}
      tracking_views: ${{ needs.impact.outputs.tracking_views == 'true' }}
      deploy_pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' }}

  reuse:
    name: REUSE
    uses: ./.github/workflows/reuse.yaml

  commitlint:
    name: Conventional Commits
    uses: ./.github/workflows/commitlint.yaml

  security:
    name: Security
    permissions:
      actions: read # required by the OSV-Scanner reusable workflow for its SARIF upload
      contents: read
      security-events: write # zizmor and OSV-Scanner upload SARIF results to code scanning
    uses: ./.github/workflows/security.yaml

  r9-tlc:
    name: R9 TLA+ model check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theoretical-projects/k7os/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java runtime
        run: java -version

      - name: Fetch and verify pinned TLC
        env:
          TLC_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          TLC_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$TLC_URL" --output "$RUNNER_TEMP/tla2tools.jar"
          printf '%s  %s\n' "$TLC_SHA256" "$RUNNER_TEMP/tla2tools.jar" | sha256sum --check -
          printf '%s  %s\n' "$TLC_SHA1" "$RUNNER_TEMP/tla2tools.jar" | sha1sum --check -

      - name: Check nominal model
        run: java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -config R9ActorCancellation.cfg R9ActorCancellation

      - name: Check the intended counterexample
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/r9-negative-tlc.log"
          set +e
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -config R9-NaiveCancelClaim.cfg R9ActorCancellation >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then
            echo "::error::TLC accepted a property whose counterexample is expected"
            exit 1
          fi
          if ! grep -F "Invariant NoCommitAfterCancelRequest" "$log" >/dev/null; then
            echo "::error::TLC stopped before the expected invariant failure"
            exit 1
          fi

      - name: Check D01 native-boundary model with enforced boundary
        run: java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -config D01-NativeBoundary.cfg D01NativeBoundary

      - name: Check D01 native-boundary counterexample without enforcement
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d01-native-boundary-negative.log"
          set +e
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -config D01-NativeBoundary-Unconfined.cfg D01NativeBoundary >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then
            echo "::error::TLC accepted the unconfined profile despite the expected integrity counterexample"
            exit 1
          fi
          if ! grep -F "Invariant ProtectedIntegrity" "$log" >/dev/null; then
            echo "::error::TLC stopped before the expected D01 ProtectedIntegrity counterexample"
            exit 1
          fi

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [impact, verify, reuse, commitlint, security, r9-tlc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the verification results
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          R9_TLC_RESULT: ${{ needs.r9-tlc.result }}
        run: |
          set -euo pipefail
          for pair in \
            "impact=$IMPACT_RESULT" \
            "verify=$VERIFY_RESULT" \
            "reuse=$REUSE_RESULT" \
            "commitlint=$COMMITLINT_RESULT" \
            "security=$SECURITY_RESULT" \
            "r9-tlc=$R9_TLC_RESULT"; do
            echo "$pair"
            result="${pair#*=}"
            [ "$result" = success ] || {
              echo "::error::le contrôle $pair n'est pas en succès"
              exit 1
            }
          done
          echo "CI OK"
  status:
    name: Generated status
    if: ${{ needs.ci-ok.result == 'success' && ( (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.refresh_axiom_status == true && inputs.axiom_source_sha != '') ) }}
    needs: [ci-ok, impact, verify, reuse, commitlint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the automation/generated-status branch
      pull-requests: write # list and open the status pull request
      actions: write # dispatch this workflow on the generated commit
    steps:
      # The credentials stay in the checkout because the publish step pushes with them. This job
      # uploads no artifact, and every step runs code that is already on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check whether STATUS already covers the current history
        id: baseline
        env:
          REQUIRE_AXIOM_AUDIT: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.refresh_axiom_status == true && inputs.axiom_source_sha != '' }}
          STATUS_EVIDENCE_SHA: ${{ inputs.axiom_source_sha || github.sha }}
        run: bash scripts/ci/ci_status_baseline.sh

      - name: Retrieve matching K7PL axiom audit evidence
        id: axiom-evidence
        if: ${{ steps.baseline.outputs.current != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ inputs.axiom_source_sha || github.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash scripts/ci/ci_status_fetch_axioms.sh

      - name: Generate STATUS.md
        if: ${{ steps.baseline.outputs.current != 'true' }}
        env:
          K7PL_VERIFICATION: ${{ needs.ci-ok.result }}
          K7PL_IMPACT_RESULT: ${{ needs.impact.result }}
          K7PL_VERIFY_RESULT: ${{ needs.verify.result }}
          K7PL_REUSE_RESULT: ${{ needs.reuse.result }}
          K7PL_COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          K7PL_SECURITY_RESULT: ${{ needs.security.result }}
          K7PL_AXIOM_AUDIT_REPORT: ${{ steps.axiom-evidence.outputs.report_path }}
          K7PL_STATUS_SOURCE_COMMIT: ${{ inputs.axiom_source_sha || github.sha }}
        run: python3 scripts/generate_status.py --verification "$K7PL_VERIFICATION" --source-commit "$K7PL_STATUS_SOURCE_COMMIT"

      - name: Check for generated changes
        id: changes
        if: ${{ steps.baseline.outputs.current != 'true' }}
        run: bash scripts/ci/ci_status_changes.sh

      - name: Publish generated status branch
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: bash scripts/ci/ci_status_publish.sh

      # The push above is made with GITHUB_TOKEN: it starts no run on its own (the pull_request run
      # it causes waits for a maintainer's approval). A workflow_dispatch event made with
      # GITHUB_TOKEN does start a run. That run is an ordinary CI run on the head of
      # automation/generated-status: its `CI OK` check is attached to that commit and fails if one
      # of the checks fails.
      - name: Run CI on the generated commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref automation/generated-status

      - name: Open or update status pull request
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/ci_status_pull_request.sh


  deploy-pages:
    name: Publish GitHub Pages
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' && needs.ci-ok.result == 'success' }}
    needs: [impact, verify, ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # deploy the specification site to GitHub Pages
      id-token: write # actions/deploy-pages authenticates the deployment with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
