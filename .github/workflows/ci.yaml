name: CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Analyse d'impact
    if: ${{ github.event_name != 'pull_request_target' && !(github.event_name == 'pull_request' && github.head_ref == 'automation/generated-status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full: ${{ steps.impact.outputs.full }}
      docs_links: ${{ steps.impact.outputs.docs_links }}
      spec_check: ${{ steps.impact.outputs.spec_check }}
      spec_build: ${{ steps.impact.outputs.spec_build }}
      lean_build: ${{ steps.impact.outputs.lean_build }}
      python_tests: ${{ steps.impact.outputs.python_tests }}
      unclassified: ${{ steps.impact.outputs.unclassified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the CI scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      # A pull request may change lake-manifest.json (a person, an agent), not only the one that
      # bump-lean.yaml opens. These are the offline checks: no network, no upstream code.
      - name: Check the Lake manifest
        run: python3 scripts/ci/check_manifest.py

      - name: Run CI impact classifier
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # scripts/ci/impact.py is the only place that decides which paths force the full validation.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/ci/impact.py --force-full
          else
            python3 scripts/ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  verify:
    name: Vérification
    needs: impact
    uses: ./.github/workflows/verify.yaml
    with:
      full: ${{ needs.impact.outputs.full == 'true' }}
      docs_links: ${{ needs.impact.outputs.docs_links == 'true' }}
      spec_check: ${{ needs.impact.outputs.spec_check == 'true' }}
      spec_build: ${{ needs.impact.outputs.spec_build == 'true' }}
      lean_build: ${{ needs.impact.outputs.lean_build == 'true' }}
      python_tests: ${{ needs.impact.outputs.python_tests == 'true' }}
      deploy_pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' }}

  reuse:
    name: REUSE
    if: ${{ github.event_name != 'pull_request_target' && !(github.event_name == 'pull_request' && github.head_ref == 'automation/generated-status') }}
    uses: ./.github/workflows/reuse.yaml

  commitlint:
    name: Conventional Commits
    if: ${{ github.event_name != 'pull_request_target' && !(github.event_name == 'pull_request' && github.head_ref == 'automation/generated-status') }}
    uses: ./.github/workflows/commitlint.yaml

  security:
    name: Security
    if: ${{ github.event_name != 'pull_request_target' && !(github.event_name == 'pull_request' && github.head_ref == 'automation/generated-status') }}
    uses: ./.github/workflows/security.yaml

  ci-ok:
    name: CI OK
    if: >-
      always() && (
        (github.event_name == 'pull_request_target' && github.head_ref == 'automation/generated-status') ||
        (github.event_name != 'pull_request_target' && !(github.event_name == 'pull_request' && github.head_ref == 'automation/generated-status'))
      )
    needs: [impact, verify, reuse, commitlint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate generated status pull request
        if: ${{ github.event_name == 'pull_request_target' && github.head_ref == 'automation/generated-status' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$REPOSITORY"

          mapfile -t files < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename'
          )
          [ "${#files[@]}" -eq 1 ] || {
            printf '::error::Le PR généré modifie %d fichiers, attendu: 1.\n' "${#files[@]}"
            printf '  %s\n' "${files[@]}"
            exit 1
          }
          [ "${files[0]}" = "docs/STATUS.md" ] || {
            echo "::error::Le PR généré ne doit modifier que docs/STATUS.md"
            exit 1
          }

          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA")" = "$(git rev-parse HEAD)"

          python3 scripts/generate_status.py --verification success
          expected="$(cat docs/STATUS.md)"
          actual="$(gh api "repos/$REPOSITORY/contents/docs/STATUS.md?ref=$HEAD_SHA" \
            --jq '.content' | base64 --decode)"
          [ "$actual" = "$expected" ] || {
            echo "::error::docs/STATUS.md ne correspond pas au générateur sur le commit de base"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

          echo "Generated status validated for $HEAD_SHA from verified base $BASE_SHA"

      - name: Check the verification results
        if: ${{ github.event_name != 'pull_request_target' }}
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for pair in \
            "impact=$IMPACT_RESULT" \
            "verify=$VERIFY_RESULT" \
            "reuse=$REUSE_RESULT" \
            "commitlint=$COMMITLINT_RESULT" \
            "security=$SECURITY_RESULT"; do
            echo "$pair"
            result="${pair#*=}"
            [ "$result" = success ] || {
              echo "::error::le contrôle $pair n'est pas en succès"
              exit 1
            }
          done
          echo "CI OK"

  status:
    name: Generated status
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success' }}
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Generate STATUS.md
        env:
          K7PL_VERIFICATION: success
        run: python3 scripts/generate_status.py --verification "$K7PL_VERIFICATION"

      - name: Check for generated changes
        id: changes
        run: |
          if git diff --quiet -- docs/STATUS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish generated status branch
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git switch -C automation/generated-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATUS.md
          git commit -m "ci: update generated project status"
          git push --force origin automation/generated-status

      - name: Open or update status pull request
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --head automation/generated-status --base main --state open --json number --jq 'length')"
          if [ "$count" -eq 0 ]; then
            gh pr create \
              --base main \
              --head automation/generated-status \
              --title "ci: update generated project status" \
              --body "Automated update of docs/STATUS.md from the CI verification gate. This file is generated; no manual status editing is required."
          fi

      - name: Validate generated status commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run CI --ref automation/generated-status

  deploy-pages:
    name: Publication GitHub Pages
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' && needs.ci-ok.result == 'success' }}
    needs: [impact, verify, ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1