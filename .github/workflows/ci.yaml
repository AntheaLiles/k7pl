name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Analyse d'impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full: ${{ steps.impact.outputs.full }}
      docs_links: ${{ steps.impact.outputs.docs_links }}
      spec_check: ${{ steps.impact.outputs.spec_check }}
      spec_build: ${{ steps.impact.outputs.spec_build }}
      lean_build: ${{ steps.impact.outputs.lean_build }}
      unclassified: ${{ steps.impact.outputs.unclassified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI impact classifier
        run: python3 scripts/ci/test_impact.py

      - name: Run CI impact classifier
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/ci/impact.py --force-full
            exit 0
          fi

          changed="$(git diff --name-only --diff-filter=ACDMRT --no-renames "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(.github/workflows/|.github/dependabot\\.yml$|scripts/ci/|lakefile\\.lean$|lean-toolchain$|lake-manifest\\.json$|scripts/sync_zenodo\\.py$|scripts/requirements-zenodo\\.txt$)'; then
            python3 scripts/ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --force-full
          else
            python3 scripts/ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  verify:
    name: Vérification
    needs: impact
    uses: ./.github/workflows/verify.yaml
    with:
      full: ${{ needs.impact.outputs.full == 'true' }}
      docs_links: ${{ needs.impact.outputs.docs_links == 'true' }}
      spec_check: ${{ needs.impact.outputs.spec_check == 'true' }}
      spec_build: ${{ needs.impact.outputs.spec_build == 'true' }}
      lean_build: ${{ needs.impact.outputs.lean_build == 'true' }}
      deploy_pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' }}

  reuse:
    name: REUSE
    uses: ./.github/workflows/reuse.yaml

  commitlint:
    name: Conventional Commits
    uses: ./.github/workflows/commitlint.yaml

  security:
    name: Security
    uses: ./.github/workflows/security.yaml

  ci-ok:
    name: CI OK
    if: always()
    needs: [impact, verify, reuse, commitlint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the verification results
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for pair in \
            "impact=$IMPACT_RESULT" \
            "verify=$VERIFY_RESULT" \
            "reuse=$REUSE_RESULT" \
            "commitlint=$COMMITLINT_RESULT" \
            "security=$SECURITY_RESULT"; do
            echo "$pair"
            result="${pair#*=}"
            [ "$result" = success ] || {
              echo "::error::le contrôle $pair n'est pas en succès"
              exit 1
            }
          done
          echo "CI OK"

  deploy-pages:
    name: Publication GitHub Pages
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.impact.outputs.spec_build == 'true' && needs.ci-ok.result == 'success' }}
    needs: [impact, verify, ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1