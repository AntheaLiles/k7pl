version: 2
updates:
  # Lean dependencies are bumped by .github/workflows/bump-lean.yaml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a freshly published release, so that a compromised release
    # that is withdrawn within days is never proposed. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Dependencies of scripts/sync_zenodo.py (hash-pinned requirements file).
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    # Same delay as above; security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
