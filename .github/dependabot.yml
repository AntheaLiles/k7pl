version: 2
updates:
  # Lean dependencies are bumped by .github/workflows/bump-lean.yaml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Dependencies of scripts/sync_zenodo.py (hash-pinned requirements file).
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
