name: Bug
description: A behaviour of the implementation, the tests or the specification does not match what was expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what was expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal Lean file or excerpt, commands run (`lake build`, `lake test`…).
      render: lean
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Error messages or full result.
      render: text
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
