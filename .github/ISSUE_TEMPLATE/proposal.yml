name: Proposal
description: Propose a change to the language, the specification or the tooling.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language (syntax, semantics, typing)
        - Specification (spec/)
        - Implementation (src/)
        - Tooling (CI, scripts, dependencies)
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem to solve or the need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The envisaged solution, with an example if possible.
    validations:
      required: true
  - type: textarea
    id: soundness
    attributes:
      label: Impact on proofs
      description: New axioms, theorems to revisit, compatibility with what already exists.
