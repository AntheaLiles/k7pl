# The Deno set-up shared by ci.yaml (controller-shadow), verify.yaml
# (impl, spec) and k7pl-semantics.yaml (k-smoke). It holds the one
# pinned reference to denoland/setup-deno and the one pinned Deno
# version, so a bump touches this file only. It receives no secret
# and needs no token permission beyond the job's own.
name: Set up Deno
description: >-
  Install the pinned Deno version with denoland/setup-deno
  (nothing else: no cache, no test).

inputs:
  deno-version:
    description: >-
      Deno version to install; the default is the version the
      CI controller is developed and tested against.
    required: false
    default: v2.9.8

runs:
  using: composite
  steps:
    - name: Install Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ inputs.deno-version }}
