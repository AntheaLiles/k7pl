# The one place where the Tectonic version and the SHA-256 of its archive are recorded (used by
# the tikz-assets and spec-pdf jobs of verify.yaml). The checksum is stored in the same repository:
# it detects a drift of the archive, it does not prove its authenticity. The TeX bundle that
# Tectonic downloads afterwards is not pinned. It receives no secret.
name: Set up Tectonic
description: >-
  Download the pinned Tectonic release (Linux x86_64 musl) and verify its SHA-256 before extracting
  it. The binary is not added to the job's PATH: the steps that run Tectonic prepend `bin-dir`
  to their own PATH (writing GITHUB_PATH from an action would change every later step).

outputs:
  version:
    description: The Tectonic version that was installed (for cache keys and summaries).
    value: ${{ steps.install.outputs.version }}
  bin-dir:
    description: The directory holding the `tectonic` binary.
    value: ${{ steps.install.outputs.bin-dir }}

runs:
  using: composite
  steps:
    - name: Install pinned Tectonic
      id: install
      shell: bash
      env:
        TECTONIC_VERSION: 0.15.0
        TECTONIC_SHA256: dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407
      run: |
        set -euo pipefail
        archive="tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@${TECTONIC_VERSION}/$archive"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
          "$url" --output "$RUNNER_TEMP/$archive"
        echo "$TECTONIC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        install -m 0755 "$RUNNER_TEMP/tectonic" "$RUNNER_TEMP/tectonic-bin"
        {
          echo "version=$TECTONIC_VERSION"
          echo "bin-dir=$RUNNER_TEMP"
        } >> "$GITHUB_OUTPUT"
